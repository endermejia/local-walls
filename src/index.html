<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>ClimBeast | fanatic community</title>
    <base href="/" />
    <meta
      name="description"
      content="La comunidad para escaladores. Registra y comparte tus encadenes, descubre zonas de escalada y explora croquis interactivos de equipadores locales."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />

    <!-- Icons & Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/logo/climbeast-small.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/logo/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/logo/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/logo/apple-touch-icon-180x180.png"
    />
    <link rel="apple-touch-icon" href="/logo/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="robots" content="index, follow" />
    <meta
      http-equiv="permissions-policy"
      content="geolocation=(self), interest-cohort=()"
    />

    <!-- Canonical URL (updated dynamically by SeoService per page) -->
    <link rel="canonical" href="https://climbeast.com/" />

    <!-- hreflang for multilingual content -->
    <link rel="alternate" hreflang="es" href="https://climbeast.com/" />
    <link rel="alternate" hreflang="en" href="https://climbeast.com/" />
    <link rel="alternate" hreflang="x-default" href="https://climbeast.com/" />

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClimBeast" />
    <meta property="og:url" content="https://climbeast.com/" />
    <meta property="og:title" content="ClimBeast | fanatic community" />
    <meta
      property="og:description"
      content="La comunidad para escaladores. Registra y comparte tus encadenes, descubre zonas de escalada y explora croquis interactivos de equipadores locales."
    />
    <meta
      property="og:image"
      content="https://climbeast.com/logo/climbeast.png"
    />
    <meta property="og:image:width" content="3000" />
    <meta property="og:image:height" content="2171" />
    <meta property="og:image:alt" content="ClimBeast | fanatic community" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClimBeast | fanatic community" />
    <meta
      name="twitter:description"
      content="La comunidad para escaladores. Registra y comparte tus encadenes, descubre zonas de escalada y explora croquis interactivos de equipadores locales."
    />
    <meta
      name="twitter:image"
      content="https://climbeast.com/logo/climbeast.png"
    />
    <meta name="twitter:image:alt" content="ClimBeast | fanatic community" />

    <!-- JSON-LD Structured Data: WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ClimBeast",
        "url": "https://climbeast.com",
        "description": "La comunidad para escaladores. Registra y comparte tus encadenes, descubre zonas de escalada y explora croquis interactivos de equipadores locales.",
        "inLanguage": ["es", "en"],
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://climbeast.com/area?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- JSON-LD Structured Data: MobileApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MobileApplication",
        "name": "ClimBeast",
        "url": "https://climbeast.com",
        "description": "The community for climbers. Log and share your ascents, discover climbing areas, and explore interactive topos from local equippers.",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR"
        },
        "screenshot": "https://climbeast.com/logo/climbeast.png"
      }
    </script>
  </head>
  <body>
    <app-root>
      <h1
        style="
          position: absolute;
          width: 1px;
          height: 1px;
          padding: 0;
          margin: -1px;
          overflow: hidden;
          clip: rect(0, 0, 0, 0);
          white-space: nowrap;
          border: 0;
        "
      >
        ClimBeast | fanatic community
      </h1>
    </app-root>
  </body>
</html>
